name: Release

on:
  push:
    tags:
      - "v0.11.2"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build EncoderBridge-Setup-x64.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build -p encoderbridge-setup --release
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item target\release\encoderbridge-setup.exe release-assets\EncoderBridge-Setup-x64.exe
          Remove-Item -Recurse -Force target

      - name: Install WiX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global wix --version 5.0.2
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          $env:Path = "$tools;$env:Path"
          wix extension add -g WixToolset.Bal.wixext/5.0.2
          Add-Content -Path $env:GITHUB_PATH -Value $tools

      - name: Patch EffectCraft v0.11.1 as v0.11.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($extra in @(
            'C:\Program Files\Android',
            'C:\Program Files (x86)\Android',
            'C:\hostedtoolcache\windows\CodeQL',
            'C:\hostedtoolcache\windows\go',
            'C:\hostedtoolcache\windows\PyPy'
          )) {
            if (Test-Path $extra) { Remove-Item -Recurse -Force $extra -ErrorAction SilentlyContinue }
          }
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git clone --depth 1 --branch v0.11.1 https://github.com/storytold/effectcraft.git effectcraft
          git -C effectcraft apply --check "$pwd\patches\effectcraft-add-to-encodecraft-queue.patch"
          git -C effectcraft apply "$pwd\patches\effectcraft-add-to-encodecraft-queue.patch"
          $cargo = Join-Path $pwd 'effectcraft\Cargo.toml'
          $text = [IO.File]::ReadAllText($cargo)
          $updated = [regex]::Replace($text, 'version = "0\.11\.1"', 'version = "0.11.2"', 1)
          if ($updated -eq $text) { throw 'Cargo.toml version was not changed to 0.11.2' }
          [IO.File]::WriteAllText($cargo, $updated)
          $menus = [IO.File]::ReadAllText("$pwd\effectcraft\crates\engine\src\menus.rs") -replace "`r`n", "`n"
          $composition = "Add to Render Queue | renderQueue.add`n  Add to EncodeCraft Queue | encodecraft.queue`n  Add Output Module | render.addOutputModule"
          $export = "Add to Render Queue | renderQueue.add`n    Add to EncodeCraft Queue | encodecraft.queue"
          if (-not $menus.Contains($composition)) { throw 'Composition menu does not place encodecraft.queue under renderQueue.add' }
          if (-not $menus.Contains($export)) { throw 'File Export menu does not place encodecraft.queue under renderQueue.add' }

      - name: Test that encodecraft.queue is registered under Add to Render Queue
        working-directory: effectcraft
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test -p effectcraft-engine --lib menus::tests -- --test-threads=8
          if ($LASTEXITCODE -ne 0) { throw "menu tests failed: $LASTEXITCODE" }
          cargo test -p effectcraft-engine --lib commands::encodecraft -- --test-threads=8
          if ($LASTEXITCODE -ne 0) { throw "encodecraft tests failed: $LASTEXITCODE" }
          Remove-Item -Recurse -Force target\debug -ErrorAction SilentlyContinue

      - name: Build patched EffectCraft
        working-directory: effectcraft
        shell: pwsh
        env:
          EFFECTCRAFT_REQUIRE_WINRES: "1"
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --release -p effectcraft -p effectcraft-cli --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed: $LASTEXITCODE" }
          $exe = "target\x86_64-pc-windows-msvc\release\effectcraft.exe"
          $latin = [Text.Encoding]::GetEncoding(28591).GetString([IO.File]::ReadAllBytes($exe))
          foreach ($needle in @('encodecraft.queue', 'Add to EncodeCraft Queue')) {
            if (-not $latin.Contains($needle)) { throw "effectcraft.exe is missing $needle" }
          }
          $version = & "target\x86_64-pc-windows-msvc\release\effectcraft-cli.exe" --version
          if ($version -notmatch '0\.11\.2') { throw "effectcraft-cli --version was '$version'" }

      - name: Package the installer and portable zip
        working-directory: effectcraft
        shell: pwsh
        env:
          EFFECTCRAFT_VERSION: "0.11.2"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:DIST = Join-Path $env:GITHUB_WORKSPACE 'effectcraft\dist\release'
          pwsh packaging\windows\package.ps1 -Arch x64 -SkipBuild
          $msi = Join-Path $env:DIST 'effectcraft-0.11.2-windows-x64.msi'
          $zip = Join-Path $env:DIST 'effectcraft-0.11.2-windows-x64-portable.zip'
          if (-not (Test-Path $msi)) { throw "missing $msi" }
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          $bundle = Join-Path $env:GITHUB_WORKSPACE '.github\windows\effectcraft-bundle.wxs'
          $setup = Join-Path $env:GITHUB_WORKSPACE 'release-assets\EffectCraft-0.11.2-EncoderBridge-Setup-x64.exe'
          wix build $bundle -ext WixToolset.Bal.wixext -arch x64 -d "MsiPath=$msi" -o $setup
          if ($LASTEXITCODE -ne 0) { throw "wix bundle failed: $LASTEXITCODE" }
          Copy-Item $zip (Join-Path $env:GITHUB_WORKSPACE 'release-assets\EffectCraft-0.11.2-EncoderBridge-windows-x64-portable.zip')

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location release-assets
          $files = @(
            'EffectCraft-0.11.2-EncoderBridge-Setup-x64.exe',
            'EffectCraft-0.11.2-EncoderBridge-windows-x64-portable.zip',
            'EncoderBridge-Setup-x64.exe'
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "missing $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            "$hash  $file"
          }
          [IO.File]::WriteAllLines((Join-Path (Get-Location) 'SHA256SUMS'), $lines)
          $tag = '${{ github.ref_name }}'
          $notes = @"
          EffectCraft 0.11.2 EncoderBridge is EffectCraft v0.11.1 with patches/effectcraft-add-to-encodecraft-queue.patch applied, versioned 0.11.2. Windows x64 only. These files are not code-signed.

          Composition, Add to EncodeCraft Queue, is directly under Add to Render Queue. The same item is under File, Export. Shortcut: Ctrl+Alt+M. Drag a composition out of the Project panel and release outside the window to queue that composition.

          - EffectCraft-0.11.2-EncoderBridge-Setup-x64.exe installs EffectCraft per machine (Program Files) using the upstream WiX package.
          - EffectCraft-0.11.2-EncoderBridge-windows-x64-portable.zip contains effectcraft.exe, effectcraft-cli.exe, and portable.txt. Settings stay in EffectCraftData next to the exe.
          - EncoderBridge-Setup-x64.exe copies EncoderBridge and Screen Suite files into the per-user plugin folders. The Composition command is in the patched EffectCraft build.

          SHA256SUMS lists the three files.
          "@
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title 'EffectCraft 0.11.2 EncoderBridge' --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "gh release create failed: $LASTEXITCODE" }
          }
          gh release upload $tag @files SHA256SUMS --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed: $LASTEXITCODE" }
