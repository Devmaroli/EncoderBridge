name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the installer from source
        run: cargo build -p encoderbridge-setup --release
      - name: Publish EncoderBridge-Setup-x64.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item target\release\encoderbridge-setup.exe EncoderBridge-Setup-x64.exe
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and -not $tag.StartsWith("v")) {
            $tag = "ci-$env:GITHUB_RUN_ID"
          }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "EncoderBridge and Screen Suite installer, built from this tag. It is not EncodeCraft. Code signing is not configured; see the repository README."
          }
          gh release upload $tag EncoderBridge-Setup-x64.exe --clobber
