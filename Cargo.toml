[workspace]
resolver = "2"
members = ["encoderbridge", "job", "screen-suite/screens", "installer"]

[workspace.package]
version = "0.6.0-beta"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/Devmaroli/EncoderBridge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
directories = "6"
encodecraft-job = { path = "job" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
